# -----------------------------------------------------------------------------
# Options
# -----------------------------------------------------------------------------
set -g prefix C-f
set -g mouse on
set -g default-terminal "tmux-256color"
set -s theme terminal

# Tell Tmux that outside terminal supports true color
set -as terminal-features ",xterm-ghostty:RGB"

# Pass OSC 52 clipboard sequences (e.g. opencode auto-copy) through to the outer terminal
set -g set-clipboard on
set -as terminal-features ",xterm-ghostty:clipboard"
# Apps inside tmux (opencode) wrap OSC 52 in a DCS passthrough; tmux >=3.3 drops it unless:
set -g allow-passthrough on

# Preserve modified keys (e.g. Shift+Enter) even when applications do not request them
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Increase left and right status bar length to accommodate longer strings
set -g status-left-length 50
set -g status-right-length 80

# Set repeat-time to 10 seconds for repeatable bindings
set -g repeat-time 10000

# Set copy-mode to use vi keys
setw -g mode-keys vi

# Show prefix indicator in right status bar
set -g status-right '#{?client_prefix,#[reverse] <Prefix> #[noreverse] ,}#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'

# -----------------------------------------------------------------------------
# Key Bindings
# -----------------------------------------------------------------------------
unbind C-b
bind C-f send-prefix

# Better mouse scrolling speed (1 line per tick instead of 5)
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Stay in copy mode after mouse selection/copy (default copy-pipe-and-cancel exits copy mode
# and jumps back to the bottom). Copy still goes to the tmux buffer + system clipboard (set-clipboard).
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
# Single click clears the selection highlight (like GUI editors); stays in copy mode
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -T copy-mode MouseDown1Pane select-pane \; send-keys -X clear-selection

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind q confirm-before -p "kill-session #S? (y/n)" kill-session
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# Use letters for choose-tree instead of numbers
bind s choose-tree -Zs -K '#{a:#{e|+:97,#{line}}}'
bind w choose-tree -Zw -K '#{a:#{e|+:97,#{line}}}'

# window hopping (allowing you to hold Ctrl while hitting prefix and n/p)
bind -r C-p previous-window
bind -r C-n next-window

# switch panes using Alt-hjkl without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# -----------------------------------------------------------------------------
# Russian (ЙЦУКЕН) layout twins for prefix bindings
# tmux only sees the character the terminal sends, so on the Russian layout
# prefix+s arrives as ы and matches nothing. Mirror the used bindings onto the
# Cyrillic letter that sits on the same physical key. (These are Cyrillic
# characters, e.g. "с" below is U+0441, not Latin "c".)
# -----------------------------------------------------------------------------
bind а command-prompt { find-window -Z "%%" }                                   # f
bind к source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."  # r
bind й confirm-before -p "kill-session #S? (y/n)" kill-session                  # q
bind с new-window                                                               # c
bind в detach-client                                                            # d
bind я resize-pane -Z                                                           # z
bind ы choose-tree -Zs -K '#{a:#{e|+:97,#{line}}}'                              # s
bind ц choose-tree -Zw -K '#{a:#{e|+:97,#{line}}}'                              # w
bind т next-window                                                              # n
bind з previous-window                                                          # p
bind щ select-pane -t :.+                                                       # o (cycle panes)
# Alt+hjkl pane movement (Ghostty sends ESC + the Cyrillic char on the Russian layout)
bind -n M-р select-pane -L                                                      # M-h
bind -n M-д select-pane -R                                                      # M-l
bind -n M-л select-pane -U                                                      # M-k
bind -n M-о select-pane -D                                                      # M-j

# choose-tree letter shortcuts (-K above) on the Russian layout. -K allows only
# one key per item and tree mode has no key table of its own, so catch the
# Cyrillic letters in the root table: while the pane is in tree-mode, forward the
# Latin letter on the same physical key; otherwise pass the character through.
bind -n й if -F '#{==:#{pane_mode},tree-mode}' 'send-keys q' 'send-keys й'
bind -n ц if -F '#{==:#{pane_mode},tree-mode}' 'send-keys w' 'send-keys ц'
bind -n у if -F '#{==:#{pane_mode},tree-mode}' 'send-keys e' 'send-keys у'
bind -n к if -F '#{==:#{pane_mode},tree-mode}' 'send-keys r' 'send-keys к'
bind -n е if -F '#{==:#{pane_mode},tree-mode}' 'send-keys t' 'send-keys е'
bind -n н if -F '#{==:#{pane_mode},tree-mode}' 'send-keys y' 'send-keys н'
bind -n г if -F '#{==:#{pane_mode},tree-mode}' 'send-keys u' 'send-keys г'
bind -n ш if -F '#{==:#{pane_mode},tree-mode}' 'send-keys i' 'send-keys ш'
bind -n щ if -F '#{==:#{pane_mode},tree-mode}' 'send-keys o' 'send-keys щ'
bind -n з if -F '#{==:#{pane_mode},tree-mode}' 'send-keys p' 'send-keys з'
bind -n ф if -F '#{==:#{pane_mode},tree-mode}' 'send-keys a' 'send-keys ф'
bind -n ы if -F '#{==:#{pane_mode},tree-mode}' 'send-keys s' 'send-keys ы'
bind -n в if -F '#{==:#{pane_mode},tree-mode}' 'send-keys d' 'send-keys в'
bind -n а if -F '#{==:#{pane_mode},tree-mode}' 'send-keys f' 'send-keys а'
bind -n п if -F '#{==:#{pane_mode},tree-mode}' 'send-keys g' 'send-keys п'
bind -n р if -F '#{==:#{pane_mode},tree-mode}' 'send-keys h' 'send-keys р'
bind -n о if -F '#{==:#{pane_mode},tree-mode}' 'send-keys j' 'send-keys о'
bind -n л if -F '#{==:#{pane_mode},tree-mode}' 'send-keys k' 'send-keys л'
bind -n д if -F '#{==:#{pane_mode},tree-mode}' 'send-keys l' 'send-keys д'
bind -n я if -F '#{==:#{pane_mode},tree-mode}' 'send-keys z' 'send-keys я'
bind -n ч if -F '#{==:#{pane_mode},tree-mode}' 'send-keys x' 'send-keys ч'
bind -n с if -F '#{==:#{pane_mode},tree-mode}' 'send-keys c' 'send-keys с'
bind -n м if -F '#{==:#{pane_mode},tree-mode}' 'send-keys v' 'send-keys м'
bind -n и if -F '#{==:#{pane_mode},tree-mode}' 'send-keys b' 'send-keys и'
bind -n т if -F '#{==:#{pane_mode},tree-mode}' 'send-keys n' 'send-keys т'
bind -n ь if -F '#{==:#{pane_mode},tree-mode}' 'send-keys m' 'send-keys ь'
